name: Build episode

on:
  push:
    paths:
      - 'pending/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Check for pending episode
        id: check
        run: |
          shopt -s nullglob
          scripts=(pending/*.txt)
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "found=false" >> $GITHUB_OUTPUT
            echo "No pending script. Nothing to do."
          else
            base=$(basename "${scripts[0]}" .txt)
            echo "found=true" >> $GITHUB_OUTPUT
            echo "script=${scripts[0]}" >> $GITHUB_OUTPUT
            echo "base=$base" >> $GITHUB_OUTPUT
            echo "Found ${scripts[0]} (base $base)"
            wc -w "${scripts[0]}"
            test -f "pending/$base.json"
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.found == 'true'
        with:
          python-version: '3.11'

      - name: Cache Kokoro model
        if: steps.check.outputs.found == 'true'
        uses: actions/cache@v4
        with:
          path: |
            kokoro-v1.0.onnx
            voices-v1.0.bin
          key: kokoro-model-v1.0

      - name: Install system packages
        if: steps.check.outputs.found == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng
          ffmpeg -version | head -1
          espeak-ng --version || true

      - name: Install python packages
        if: steps.check.outputs.found == 'true'
        run: pip install kokoro-onnx soundfile numpy pillow --quiet

      - name: Fetch Kokoro model files
        if: steps.check.outputs.found == 'true'
        run: |
          set -e
          [ -f kokoro-v1.0.onnx ] || curl -sL --retry 3 -O https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          [ -f voices-v1.0.bin ] || curl -sL --retry 3 -O https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
          ls -la kokoro-v1.0.onnx voices-v1.0.bin

      - name: Render audio
        if: steps.check.outputs.found == 'true'
        run: |
          set -ex
          python3 tools/render_episode.py "${{ steps.check.outputs.script }}" "${{ steps.check.outputs.base }}.wav" bm_daniel 1.05
          ls -la "${{ steps.check.outputs.base }}.wav"

      - name: Encode MP3
        if: steps.check.outputs.found == 'true'
        run: |
          set -ex
          mkdir -p episodes
          ffmpeg -y -loglevel error -i "${{ steps.check.outputs.base }}.wav" \
            -codec:a libmp3lame -b:a 96k -ar 44100 \
            -metadata artist="The Daily Build" -metadata album="The Daily Build" \
            "episodes/${{ steps.check.outputs.base }}.mp3"
          ls -la "episodes/${{ steps.check.outputs.base }}.mp3"

      - name: Register episode and build feed
        if: steps.check.outputs.found == 'true'
        run: |
          set -ex
          if [ ! -f cover.png ]; then python3 tools/make_cover.py; fi
          python3 tools/add_episode.py "${{ steps.check.outputs.base }}" "pending/${{ steps.check.outputs.base }}.json"
          python3 tools/generate_feed.py
          head -c 600 feed.xml

      - name: Commit and push
        if: steps.check.outputs.found == 'true'
        run: |
          set -ex
          rm -f "${{ steps.check.outputs.script }}" "pending/${{ steps.check.outputs.base }}.json" "${{ steps.check.outputs.base }}.wav"
          git config user.name "Daily Build Bot"
          git config user.email "actions@github.com"
          git checkout -B master
          git add -A
          git status --short
          git commit -m "Publish ${{ steps.check.outputs.base }}" || { echo "Nothing to commit"; exit 0; }
          for i in 1 2 3; do
            git fetch origin master
            git rebase origin/master && git push origin HEAD:master && exit 0
            git rebase --abort || true
            sleep 10
          done
          echo "push failed after 3 attempts"
          exit 1

      - name: Report
        if: steps.check.outputs.found == 'true'
        run: |
          echo "Published ${{ steps.check.outputs.base }}"
          echo "Feed: https://playfundwin.github.io/daily-build-feed/feed.xml"
