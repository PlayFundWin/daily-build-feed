name: Build episode

on:
  push:
    paths:
      - 'pending/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Check for pending episode
        id: check
        run: |
          shopt -s nullglob
          scripts=(pending/*.txt)
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "found=false" >> $GITHUB_OUTPUT
            echo "No pending script. Nothing to do."
          else
            echo "found=true" >> $GITHUB_OUTPUT
            echo "script=${scripts[0]}" >> $GITHUB_OUTPUT
            echo "Found ${scripts[0]}"
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.found == 'true'
        with:
          python-version: '3.11'

      - name: Cache Kokoro model
        if: steps.check.outputs.found == 'true'
        uses: actions/cache@v4
        with:
          path: |
            kokoro-v1.0.onnx
            voices-v1.0.bin
          key: kokoro-model-v1.0

      - name: Install dependencies
        if: steps.check.outputs.found == 'true'
        run: |
          pip install kokoro-onnx soundfile numpy pillow --quiet
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          if [ ! -f kokoro-v1.0.onnx ]; then
            curl -sL --retry 3 -O https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          fi
          if [ ! -f voices-v1.0.bin ]; then
            curl -sL --retry 3 -O https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
          fi
          ls -la kokoro-v1.0.onnx voices-v1.0.bin

      - name: Render and publish
        if: steps.check.outputs.found == 'true'
        run: |
          set -e
          SCRIPT="${{ steps.check.outputs.script }}"
          BASE=$(basename "$SCRIPT" .txt)
          META="pending/$BASE.json"
          test -f "$META" || { echo "Missing $META"; exit 1; }
          mkdir -p episodes
          python3 tools/render_episode.py "$SCRIPT" "$BASE.wav" bm_daniel 1.05
          ffmpeg -y -loglevel error -i "$BASE.wav" -codec:a libmp3lame -b:a 96k -ar 44100 \
            -metadata artist="The Daily Build" -metadata album="The Daily Build" \
            "episodes/$BASE.mp3"
          ls -la "episodes/$BASE.mp3"
          [ ! -f cover.png ] && python3 tools/make_cover.py || true
          python3 tools/add_episode.py "$BASE" "$META"
          python3 tools/generate_feed.py
          rm -f "$SCRIPT" "$META" "$BASE.wav"
          git config user.name "Daily Build Bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Publish $BASE" || { echo "Nothing to commit"; exit 0; }
          git push

      - name: Report
        if: steps.check.outputs.found == 'true'
        run: |
          echo "Published. Feed: https://playfundwin.github.io/daily-build-feed/feed.xml"
