name: concat-covered
on:
  workflow_dispatch: {}
jobs:
  concat:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Concatenate parts into archive/covered.md
        run: |
          python3 - <<'PYEOF'
          import io

          def read(p):
              with open(p, 'r', encoding='utf-8') as f:
                  return f.read()

          part1 = read('archive/covered.md')
          part2 = read('archive/_tmp_covered_part2.md')
          part2b = read('archive/_tmp_covered_part2b.md')
          part3 = read('archive/_tmp_covered_part3.md')
          part3b1 = read('archive/_tmp_covered_part3b1.md')
          part3b2 = read('archive/_tmp_covered_part3b2.md')

          final = (
              part1 + "\n"
              + part2
              + part2b
              + "\n"
              + part3
              + "\n\n"
              + part3b1
              + part3b2
              + "\n"
          )

          with open('archive/covered.md', 'w', encoding='utf-8') as f:
              f.write(final)

          print("final length:", len(final.encode('utf-8')))
          PYEOF
      - name: Remove temp staging files and this workflow
        run: |
          rm -f archive/_tmp_covered_part2.md archive/_tmp_covered_part2b.md archive/_tmp_covered_part3.md archive/_tmp_covered_part3b1.md archive/_tmp_covered_part3b2.md
          rm -f .github/workflows/concat-covered.yml
      - name: Commit and push
        run: |
          git config user.name "daily-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Concat Ep43 covered.md from staged parts and clean up temp files"
          git push
