name: Deploy Pages

on:
  push:
    branches: [master]
    paths:
      - 'feed.xml'
      - 'cover.png'
      - 'episodes/**'
      - 'bedford/feed.xml'
      - 'bedford/cover.png'
      - 'bedford/episodes/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage site
        run: |
          set -ex
          mkdir -p _site/episodes _site/bedford/episodes
          cp feed.xml _site/
          [ -f cover.png ] && cp cover.png _site/ || true
          cp episodes/*.mp3 _site/episodes/ 2>/dev/null || true
          [ -f bedford/feed.xml ] && cp bedford/feed.xml _site/bedford/ || true
          [ -f bedford/cover.png ] && cp bedford/cover.png _site/bedford/ || true
          cp bedford/episodes/*.mp3 _site/bedford/episodes/ 2>/dev/null || true
          ls -la _site _site/episodes _site/bedford _site/bedford/episodes

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
